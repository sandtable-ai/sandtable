[project]
name = "sandtable-ai"
version = "0.1.0"
description = "Rehearse AI agents on a sand table of your customer's world before they go live. Python launcher for the sandtable CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["ai-agents", "evals", "agent-testing", "simulation", "tau-bench", "pass^k"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://sandtable.dev"
Documentation = "https://sandtable.dev"
Repository = "https://github.com/sandtable-ai/sandtable"
Changelog = "https://github.com/sandtable-ai/sandtable/blob/main/CHANGELOG.md"

[project.scripts]
sandtable = "sandtable_ai.cli:main"
# `uvx sandtable-ai` runs the executable named after the package.
sandtable-ai = "sandtable_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandtable_ai"]
