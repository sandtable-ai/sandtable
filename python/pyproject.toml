[project]
name = "sandtable-ai"
version = "0.1.0a0"
description = "Rehearse AI agents on a sand table of your customer's world before they go live. Python launcher for the sandtable CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["ai-agents", "evals", "agent-testing", "simulation", "tau-bench", "pass^k"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sandtable-ai/sandtable"
Repository = "https://github.com/sandtable-ai/sandtable"

[project.scripts]
sandtable = "sandtable_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandtable_ai"]
