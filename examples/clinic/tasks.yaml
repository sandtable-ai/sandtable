      - Hi, this is Kenji Watanabe, date of birth February 17, 1988. I'd like to see Dr. Beckwith on Wednesday, my coworker recommended him.
      - No thanks, I only want Dr. Beckwith and I'm not paying out of pocket. I'll check with my insurance.
