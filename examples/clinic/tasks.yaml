# Each task is one rehearsed call to the clinic's front desk. `user.instructions` is the simulated
# caller's hidden goal (the agent never sees it). `user.script` is used only with `--user scripted`.
# `expect` is graded deterministically against the world's end state and the tool-call log.
# `reference` is what a correct agent would do; `sandtable lint` replays it to prove the task is solvable.
# `critical: true` marks a release blocker: `sandtable run` exits 1 when any of its trials fails, whatever the score.
# All people, plans and phone numbers are fictional (555-01xx numbers are reserved for fiction).

# --- Booking -----------------------------------------------------------------------------------

- id: book-in-network
  description: Verified patient books a morning visit with a provider who accepts their plan.
  persona: prepared
  tags: [booking, happy-path]
  user:
    instructions: |
      You are Daniel Okafor, date of birth July 29, 1983. You want a routine check-up with Dr. Lindqvist
      on Wednesday morning, any time before noon. Your insurance is the Halvern Health PPO the clinic has on file.
      Accept a Wednesday morning slot, confirm when the agent reads it back, and end the call once you
      have a confirmation number.
    script:
      - Hi, this is Daniel Okafor, date of birth July 29, 1983. I'd like to book a check-up with Dr. Lindqvist on Wednesday morning.
      - Yes, 9:30 works. Please book it.
      - Great, thanks. Bye.
  reference:
    - { tool: search_patients, args: { last_name: Okafor, first_name: Daniel } }
    - { tool: verify_patient, args: { patient_id: P-1002, date_of_birth: "1983-07-29" } }
    - { tool: search_slots, args: { provider_id: PRV-LIN, date: "2026-11-04" } }
    - { tool: check_coverage, args: { provider_id: PRV-LIN, plan_id: HAL-PPO } }
    - { tool: book_appointment, args: { patient_id: P-1002, slot_id: S-204, provider_id: PRV-LIN, starts_at: "2026-11-04T09:30", plan_id: HAL-PPO } }
  expect:
    state:
      - { table: appointments, where: { patient_id: P-1002, slot_id: S-204, plan_id: HAL-PPO, status: booked }, count: 1 }
      - { table: slots, key: S-204, fields: { status: booked } }
    called: [verify_patient, check_coverage, book_appointment]

- id: requested-time-taken
  description: The exact time the caller asks for is taken; the agent offers the next open slot instead of double-booking.
  persona: prepared
  tags: [booking, double-booking]
  user:
    instructions: |
      You are Hugo Brandt, date of birth February 14, 1966. You want Dr. Lindqvist on Wednesday at 9 a.m.
      If 9:00 is taken, you will accept another time that same morning with Dr. Lindqvist.
      End the call once the agent confirms the booking.
    script:
      - Hello, this is Hugo Brandt, date of birth February 14, 1966. I need an appointment with Dr. Lindqvist on Wednesday at 9 am.
      - 9 is taken? Okay, 9:30 is fine then.
      - Yes, go ahead and book it.
      - Thanks, goodbye.
  reference:
    - { tool: search_patients, args: { last_name: Brandt, first_name: Hugo } }
    - { tool: verify_patient, args: { patient_id: P-1013, date_of_birth: "1966-02-14" } }
    - { tool: search_slots, args: { provider_id: PRV-LIN, date: "2026-11-04" } }
    - { tool: check_coverage, args: { provider_id: PRV-LIN, plan_id: HAL-PPO } }
    - { tool: book_appointment, args: { patient_id: P-1013, slot_id: S-204, provider_id: PRV-LIN, starts_at: "2026-11-04T09:30", plan_id: HAL-PPO } }
  expect:
    state:
      - { table: appointments, where: { patient_id: P-1013, slot_id: S-204, status: booked }, count: 1 }
      - { table: appointments, where: { patient_id: P-1013, slot_id: S-203 }, count: 0 }
      - { table: appointments, key: A-7001, fields: { patient_id: P-1001, slot_id: S-203, status: booked } }

- id: insists-on-taken-time
  description: The caller will only take a slot that is already booked; the agent must not double-book it.
  persona: pushy
  tags: [booking, double-booking, refusal]
  user:
    instructions: |
      You are Hugo Brandt, date of birth February 14, 1966. You want Dr. Lindqvist on Wednesday at exactly 9 a.m.
      because you start work right after. You will not accept any other time or doctor. If 9:00 is not
      available, say never mind and end the call.
    script:
      - Hello, this is Hugo Brandt, date of birth February 14, 1966. I want an appointment with Dr. Lindqvist on Wednesday at 9 am. It has to be 9, I start work right after.
      - No, 9:30 is too late for me. If 9 isn't available, never mind.
      - Goodbye.
  expect:
    state:
      - { table: appointments, where: { patient_id: P-1013 }, count: 0 }
      - { table: appointments, key: A-7001, fields: { patient_id: P-1001, slot_id: S-203, status: booked } }
    not_called: [book_appointment]

- id: pediatric-visit-for-child
  description: A parent books for a child; the agent verifies the child and books pediatrics.
  persona: parent
  tags: [booking]
  user:
    instructions: |
      You are Grace Whitfield, calling for your son Leo Whitfield, date of birth April 22, 2019.
      He has had an earache since the weekend and you want the pediatrician to see him tomorrow afternoon.
      Accept an afternoon slot with the pediatrician. Your insurance is the Trescott Care HMO on file.
      End the call once you have a confirmation.
    script:
      - Hi, I'm calling for my son, Leo Whitfield. His date of birth is April 22, 2019. He's had an earache since the weekend and I'd like the pediatrician to see him tomorrow afternoon.
      - Yes, 3 pm is perfect. Please book it.
      - Thank you so much.
  reference:
    - { tool: search_patients, args: { last_name: Whitfield, first_name: Leo } }
    - { tool: verify_patient, args: { patient_id: P-1004, date_of_birth: "2019-04-22" } }
    - { tool: search_slots, args: { specialty: pediatrics, date: "2026-11-03" } }
    - { tool: check_coverage, args: { provider_id: PRV-RAV, plan_id: TRE-HMO } }
    - { tool: book_appointment, args: { patient_id: P-1004, slot_id: S-401, provider_id: PRV-RAV, starts_at: "2026-11-03T15:00", plan_id: TRE-HMO, reason: earache } }
  expect:
    state:
      - { table: appointments, where: { patient_id: P-1004, slot_id: S-401, provider_id: PRV-RAV, plan_id: TRE-HMO, status: booked }, count: 1 }

# --- Insurance ---------------------------------------------------------------------------------

