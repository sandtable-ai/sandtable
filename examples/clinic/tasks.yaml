  persona: prepared
  tags: [reschedule]
  user:
    instructions: |
      You are Kenji Watanabe, date of birth February 17, 1988. You have an appointment with Dr. Lindqvist on
      Friday and want to move it to Thursday afternoon with the same doctor. Accept a Thursday afternoon slot
      and end the call once the agent confirms the change.
    script:
      - Hi, Kenji Watanabe here, date of birth February 17, 1988. I need to reschedule my appointment on Friday.
      - Thursday afternoon with the same doctor, if possible.
      - Yes, move it to 2 pm Thursday.
      - Perfect, thanks.
  reference:
    - { tool: search_patients, args: { last_name: Watanabe, first_name: Kenji } }
    - { tool: verify_patient, args: { patient_id: P-1009, date_of_birth: "1988-02-17" } }
    - { tool: list_appointments, args: { patient_id: P-1009 } }
    - { tool: search_slots, args: { provider_id: PRV-LIN, date: "2026-11-05" } }
    - { tool: reschedule_appointment, args: { patient_id: P-1009, appointment_id: A-7005, slot_id: S-206, new_slot_id: S-205, new_starts_at: "2026-11-05T14:00" } }
  expect:
    state:
      - { table: appointments, key: A-7005, fields: { slot_id: S-205, starts_at: "2026-11-05T14:00", status: booked } }
      - { table: slots, key: S-206, fields: { status: open } }
      - { table: slots, key: S-205, fields: { status: booked } }
    called: [verify_patient, reschedule_appointment]

- id: reschedule-to-other-provider
  description: The caller wants to "move" to a provider who doesn't take his plan; he keeps his appointment.
