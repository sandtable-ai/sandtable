  reference:
    - { tool: search_patients, args: { last_name: Pryce, first_name: Owen } }
    - { tool: verify_patient, args: { patient_id: P-1011, date_of_birth: "1979-05-21" } }
    - { tool: list_appointments, args: { patient_id: P-1011 } }
    - tool: leave_message
