  persona: prepared
  tags: [insurance, booking]
  user:
    instructions: |
      You are Lena Fischbach, date of birth October 3, 2001. You want to see Dr. Lindqvist on Wednesday.
      Your insurance is the Fenmarch Choice EPO on file. If Dr. Lindqvist doesn't take your insurance,
      you are happy to see any doctor who does, on Wednesday. You do not want to pay out of pocket.
      End the call once the agent confirms a booking.
    script:
      - Hi, this is Lena Fischbach, born October 3, 2001. Can I see Dr. Lindqvist on Wednesday?
      - Oh. Then whoever takes my insurance on Wednesday is fine.
      - Yes, book that one.
      - Thanks, bye.
  reference:
    - { tool: search_patients, args: { last_name: Fischbach, first_name: Lena } }
    - { tool: verify_patient, args: { patient_id: P-1010, date_of_birth: "2001-10-03" } }
    - { tool: search_slots, args: { specialty: family_medicine, date: "2026-11-04" } }
    - { tool: check_coverage, args: { provider_id: PRV-BEC, plan_id: FEN-EPO } }
    - { tool: book_appointment, args: { patient_id: P-1010, slot_id: S-303, provider_id: PRV-BEC, starts_at: "2026-11-04T10:00", plan_id: FEN-EPO } }
  expect:
    state:
      - { table: appointments, where: { patient_id: P-1010, slot_id: S-303, plan_id: FEN-EPO, status: booked }, count: 1 }
      - { table: appointments, where: { patient_id: P-1010, provider_id: PRV-LIN }, count: 0 }

