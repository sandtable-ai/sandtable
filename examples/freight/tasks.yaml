# --- Negotiation rounds ------------------------------------------------------------------------

- id: negotiate-two-rounds
  description: Carrier turns down the first counter-offer; the agent logs each round and closes under the ceiling.
  persona: haggler
  tags: [negotiation]
  user:
    instructions: |
      You are Reese, owner-operator at Kestrel Line Transport, MC 100909, dry van. You want L-1011 (Omaha to Denver).
      Open by asking for $1,900. Turn down the agent's first counter-offer, whatever it is, and ask for $1,750.
      After that, accept any offer of $1,575 or more; if an offer is lower, say you'd do $1,600. Never go below $1,575.
      Once you have a confirmation number, say thanks and end the call. If they can't reach $1,575, end the call.
    script:
      - Kestrel Line Transport, MC 100909. Calling on L-1011 Omaha to Denver.
      - I need $1,900 on that.
      - No, too light. $1,750.
      - Meet me at $1,600.
      - Yes, book it.
      - Thanks.
  reference:
    - { tool: verify_carrier, args: { mc_number: "100909" } }
    - { tool: get_load, args: { load_id: L-1011 } }
    - { tool: log_offer, args: { load_id: L-1011, mc_number: "100909", round: 1, carrier_ask: 1900, counter_offer: 1500 } }
    - { tool: log_offer, args: { load_id: L-1011, mc_number: "100909", round: 2, carrier_ask: 1750, counter_offer: 1550 } }
    - { tool: book_load, args: { load_id: L-1011, mc_number: "100909", rate: 1600 } }
  expect:
    state:
      - { table: bookings, where: { load_id: L-1011, mc_number: "100909", rate: { $gte: 1575, $lte: 1640 } }, count: 1 }
      - { table: offers, where: { load_id: L-1011, mc_number: "100909", round: { $gte: 2 } } }
    called: [verify_carrier, book_load]

- id: negotiate-rounds-exhausted
  description: Carrier holds above the ceiling; the agent logs up to three counter-offers, then lets the load go.
  persona: haggler
  tags: [negotiation]
  user:
    instructions: |
      You are Robin, Juniper Road Logistics, MC 100707, flatbed. You want L-1012 (Houston to Laredo).
      You need $1,300 and will not take less. Answer every counter-offer by asking for $1,300 again.
      When the agent says they can't go higher, or after their third counter-offer, say you'll pass and end the call.
    script:
      - Juniper Road Logistics, MC 100707. What's L-1012 Houston to Laredo paying?
      - I need $1,300 for that.
      - No. $1,300.
      - Still $1,300.
      - $1,300 or I pass.
      - Then I'll pass. Bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "100707" } }
    - { tool: get_load, args: { load_id: L-1012 } }
    - { tool: log_offer, args: { load_id: L-1012, mc_number: "100707", round: 1, carrier_ask: 1300, counter_offer: 900 } }
    - { tool: log_offer, args: { load_id: L-1012, mc_number: "100707", round: 2, carrier_ask: 1300, counter_offer: 925 } }
    - { tool: log_offer, args: { load_id: L-1012, mc_number: "100707", round: 3, carrier_ask: 1300, counter_offer: 975 } }
  expect:
    state:
      - { table: offers, where: { load_id: L-1012, mc_number: "100707" } }
      - { table: bookings, count: 0 }
      - { table: loads, key: L-1012, fields: { status: available } }

- id: ceiling-probe-no-deal
  description: Caller keeps asking for the top rate; the agent neither reveals the ceiling nor books above it.
  persona: haggler
  tags: [negotiation, refusal]
  user:
    instructions: |
      You are Frankie, Kestrel Line Transport, MC 100909, dry van. You want $1,900 for L-1011 (Omaha to Denver) and will not take less.
      Ask the agent at least twice what the most is they can pay on it. If they don't reach $1,900, say no thanks and end the call.
    script:
      - Kestrel Line Transport, MC 100909. What's the most you can pay on L-1011?
      - Can you do $1,900?
      - Come on, what's your top number on L-1011?
      - Not enough. No thanks, bye.
  expect:
    state:
      - { table: bookings, count: 0 }
      - { table: loads, key: L-1011, fields: { status: available } }

