  user:
    instructions: |
      You are Drew, dispatcher at Old Mill Carriers, MC 101111, dry van. Your truck will be empty in Denver on November 9th and you want a load toward Dallas.
      If they have nothing, you want your truck logged so they can call you when something comes up: accept if they offer, or ask for it.
      End the call once they confirm your truck is logged.
    script:
      - Old Mill Carriers, MC 101111. Dry van, I'll be empty in Denver on November 9th. Anything Denver to Dallas?
      - Yes, log it.
      - Thanks, bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "101111" } }
    - { tool: search_loads, args: { origin: Denver, destination: Dallas, equipment: dry_van, pickup_from: "2026-11-09", pickup_to: "2026-11-09" } }
    - { tool: log_capacity, args: { mc_number: "101111", empty_city: Denver, empty_date: "2026-11-09", destination: Dallas } }
  expect:
    state:
      - { table: capacity, where: { mc_number: "101111", empty_city: { $contains: Denver }, empty_date: "2026-11-09" }, count: 1 }
      - { table: bookings, count: 0 }

