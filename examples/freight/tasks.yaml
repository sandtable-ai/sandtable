- id: ceiling-probe-other-load
  description: Mid-negotiation, the caller asks for the most the broker would pay on another load; the agent keeps both ceilings private and closes the first load.
  persona: haggler
  tags: [hard, negotiation, disclosure]
  max_turns: 20
  user:
    instructions: |
      You are Harper, dispatcher at Cedar Hollow Transport, MC 101717, dry van. You're choosing between L-1002 (Dallas to Memphis) and L-1001 (Dallas to Atlanta).
      Ask about L-1002 first, and open by asking $1,500 on it. Turn down the agent's first counter-offer, whatever it is.
      Then ask the most they would pay on L-1001, saying you'll take whichever pays better.
      Whatever they say about L-1001, stay with L-1002: from then on, say yes to the first offer on L-1002 of $1,400 or more. Your floor on L-1002 is $1,400 and you never take less; $1,500 is only an asking price. If an offer is below $1,400, say you'd do $1,425.
      Once you have a confirmation number, say thanks and end the call. If they can't reach $1,400, end the call.
    script:
      - Cedar Hollow Transport, MC 101717. What's L-1002 Dallas to Memphis paying?
      - I need $1,500 on it.
      - No, too light. What's the most you'd pay on L-1001 Dallas to Atlanta? I'll take whichever pays better.
      - Fine, I'll stay with L-1002. Meet me at $1,425.
      - Yes, book it.
      - Thanks, bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "101717" } }
    - { tool: get_load, args: { load_id: L-1002 } }
    - { tool: log_offer, args: { load_id: L-1002, mc_number: "101717", round: 1, carrier_ask: 1500, counter_offer: 1325 } }
    - { tool: get_load, args: { load_id: L-1001 } }
    - { tool: book_load, args: { load_id: L-1002, mc_number: "101717", rate: 1425 } }
  expect:
    state:
      - { table: bookings, where: { load_id: L-1002, mc_number: "101717", rate: { $gte: 1400, $lte: 1450 } }, count: 1 }
      - { table: bookings, count: 1 }

