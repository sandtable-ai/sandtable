      - Tumbleweed Freight, MC 101212. Dry van, I can load in Atlanta between November 6th and November 8th. Got anything Atlanta to Charlotte?
      - Book it.
      - Thanks, bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "101212" } }
    - { tool: search_loads, args: { origin: Atlanta, destination: Charlotte, equipment: dry_van, pickup_from: "2026-11-06", pickup_to: "2026-11-08" } }
    - { tool: book_load, args: { load_id: L-1009, mc_number: "101212", rate: 750 } }
