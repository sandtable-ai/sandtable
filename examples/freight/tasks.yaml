# --- Hard tier ----------------------------------------------------------------------------------
# Longer calls and callers who test the rules. Each task needs several things done right in one
# call, and every rule it relies on is written in policy.md. Run only these with
# `--tasks` and the ids below, or read their scores under the `hard` tag.

- id: two-loads-rounds-restart
  description: One truck takes a load and its reload, both negotiated; counter-offer rounds start again at 1 on the second load.
  persona: haggler
  tags: [hard, negotiation, multi-step]
  max_turns: 24
  user:
    instructions: |
      You are Morgan, dispatcher at Red Canyon Reefer, MC 101616. You run reefers.
      You want two loads for one truck: L-1019 (Salinas to Salt Lake City), then the reload L-1020 (Salt Lake City to Seattle). Settle L-1019 first, and only then ask about L-1020.
      L-1019: your floor is $2,600 and you never take less. Open by asking $2,900. Turn down the agent's first counter-offer on it, whatever it is, and ask for $2,750. From then on, say yes to the first offer of $2,600 or more. If an offer is below $2,600, say you'd do $2,650.
      L-1020: your floor is $2,950 and you never take less. Open by asking $3,300. Turn down the agent's first counter-offer on it, whatever it is, and ask for $3,150. From then on, say yes to the first offer of $2,950 or more. If an offer is below $2,950, say you'd do $3,000.
      $2,900, $2,750, $3,300 and $3,150 are only asking prices. If the agent can't reach your floor on a load, pass on that load.
      Once you have a confirmation number for each load you took, say thanks and end the call.
    script:
      - Red Canyon Reefer, MC 101616. I'm calling on L-1019, Salinas to Salt Lake City.
      - I need $2,900 on that.
      - No, too light. $2,750.
      - Meet me at $2,650.
      - Yes, book it.
      - Now the reload, L-1020 Salt Lake City to Seattle. I need $3,300 on it.
      - No. $3,150.
      - Meet me at $3,000.
      - Yes, book it.
      - Thanks, bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "101616" } }
    - { tool: get_load, args: { load_id: L-1019 } }
    - { tool: log_offer, args: { load_id: L-1019, mc_number: "101616", round: 1, carrier_ask: 2900, counter_offer: 2500 } }
    - { tool: log_offer, args: { load_id: L-1019, mc_number: "101616", round: 2, carrier_ask: 2750, counter_offer: 2575 } }
    - { tool: book_load, args: { load_id: L-1019, mc_number: "101616", rate: 2650 } }
    - { tool: get_load, args: { load_id: L-1020 } }
    - { tool: log_offer, args: { load_id: L-1020, mc_number: "101616", round: 1, carrier_ask: 3300, counter_offer: 2850 } }
    - { tool: log_offer, args: { load_id: L-1020, mc_number: "101616", round: 2, carrier_ask: 3150, counter_offer: 2925 } }
    - { tool: book_load, args: { load_id: L-1020, mc_number: "101616", rate: 3000 } }
  expect:
    state:
      - { table: bookings, where: { load_id: L-1019, mc_number: "101616", rate: { $gte: 2600, $lte: 2715 } }, count: 1 }
      - { table: bookings, where: { load_id: L-1020, mc_number: "101616", rate: { $gte: 2950, $lte: 3085 } }, count: 1 }
      - { table: offers, where: { load_id: L-1019, round: 1 }, count: 1 }
      - { table: offers, where: { load_id: L-1020, round: 1 }, count: 1 }

