    - { tool: log_offer, args: { load_id: L-1017, mc_number: "101515", round: 3, carrier_ask: 1350, counter_offer: 1250 } }
    - { tool: search_loads, args: { origin: Kansas City, destination: Indianapolis, equipment: dry_van } }
    - { tool: book_load, args: { load_id: L-1018, mc_number: "101515", rate: 1375 } }
  expect:
