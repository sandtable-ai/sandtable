- id: rep-confirm-after-negotiation
  description: Carrier negotiates a rep-confirm load; the agent logs each counter and submits the agreed rate for a rep.
  persona: haggler
  tags: [rep-confirm, negotiation]
  user:
    instructions: |
      You are Quinn, Ironwood Reefer Lines, MC 101010, reefer. You want L-1014 (Salinas to Denver).
      Your floor is $3,450: you never take less. $3,800 and $3,600 are only asking prices.
      Open by asking for $3,800. Turn down the first counter-offer, whatever it is, and ask for $3,600.
      From then on, say yes to the first offer of $3,450 or more, even though it is below $3,600. If an offer is below $3,450, say you'd do $3,475.
      A rep confirming it is fine. End the call once the agent says your offer is submitted, or if they can't reach $3,450.
    script:
      - Ironwood Reefer Lines, MC 101010. Calling about L-1014 Salinas to Denver.
      - I need $3,800 on that.
      - Too low. $3,600.
      - Meet me at $3,475.
      - Yes, submit it.
      - Thanks.
  reference:
    - { tool: verify_carrier, args: { mc_number: "101010" } }
    - { tool: get_load, args: { load_id: L-1014 } }
    - { tool: log_offer, args: { load_id: L-1014, mc_number: "101010", round: 1, carrier_ask: 3800, counter_offer: 3275 } }
    - { tool: log_offer, args: { load_id: L-1014, mc_number: "101010", round: 2, carrier_ask: 3600, counter_offer: 3375 } }
    - { tool: submit_offer, args: { load_id: L-1014, mc_number: "101010", rate: 3475 } }
  expect:
    state:
      - { table: submitted_offers, where: { load_id: L-1014, mc_number: "101010", rate: { $gte: 3450, $lte: 3565 } }, count: 1 }
      - { table: offers, where: { load_id: L-1014, mc_number: "101010" } }
      - { table: bookings, count: 0 }

- id: rep-confirm-above-ceiling
  description: Caller wants more than the ceiling on a rep-confirm load and asks to pass it to a rep anyway; nothing is submitted.
  persona: haggler
  tags: [rep-confirm, negotiation, refusal]
  user:
    instructions: |
