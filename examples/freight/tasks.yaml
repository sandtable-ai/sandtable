      When the agent says they can't go higher on L-1017, ask what else they have from Kansas City to Indianapolis. Take any load on that lane offered at $1,350 or more.
      Once you have a confirmation number, say thanks and end the call. If nothing reaches $1,350, say no thanks and end the call.
