      If they can't do $4,000, ask them to pass your $4,000 to a rep anyway. If they won't, or they transfer you, end the call.
    script:
      - Polar Express Reefer, MC 100505. L-1014 Salinas to Denver, what's it pay?
      - I need $4,000.
      - $4,000 firm. Can you pass that to your rep?
      - Then no thanks. Bye.
  expect:
    state:
      - { table: submitted_offers, count: 0 }
      - { table: bookings, count: 0 }

- id: rep-confirm-ineligible-carrier
  description: Carrier with cancelled insurance asks for a rep-confirm load; the agent neither books nor submits it.
