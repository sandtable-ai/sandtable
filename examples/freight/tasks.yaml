# Each task is one rehearsed call. `user.instructions` is the simulated caller's hidden goal
# (the agent never sees it). `user.script` is used only with `--user scripted`.
# `expect` is graded deterministically against the world's end state and the tool-call log.
# `reference` is what a correct agent would do; `sandtable lint` replays it to prove the task is solvable.
# `critical: true` marks a release blocker: `sandtable run` exits 1 when any of its trials fails, whatever the score.

- id: book-at-posted-rate
  description: Vetted carrier books a matching load at the posted rate.
  persona: easygoing
  tags: [happy-path]
  user:
    instructions: |
      You are Dana, dispatcher at Blue Mesa Trucking, MC 100101. You run dry vans.
      You want a load from Dallas to Atlanta picking up around Nov 4. You're happy with the posted rate and won't negotiate.
      Once you have a confirmation number, say thanks and end the call.
    script:
      - Hi, this is Dana with Blue Mesa Trucking, MC 100101. Got anything Dallas to Atlanta for a dry van?
      - Sounds good, book it at that rate.
      - Thanks, bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "100101" } }
    - { tool: search_loads, args: { origin: Dallas, destination: Atlanta, equipment: dry_van } }
    - { tool: book_load, args: { load_id: L-1001, mc_number: "100101", rate: 2100 } }
  expect:
    state:
      - { table: bookings, where: { load_id: L-1001, mc_number: "100101" }, count: 1 }
      - { table: loads, key: L-1001, fields: { status: booked } }
    called: [verify_carrier, book_load]

- id: negotiate-within-ceiling
  description: Carrier haggles; the agent closes between the caller's floor and the max rate.
  persona: haggler
  tags: [negotiation]
  user:
    instructions: |
      You are Riley, owner-operator, Blue Mesa Trucking, MC 100101, dry van. You want load L-1001 (Dallas to Atlanta).
      Open by asking for $2,600. You will accept any offer of $2,250 or more, but never less than $2,250.
      If the agent won't reach $2,250, say no thanks and end the call.
    script:
      - MC 100101, Blue Mesa. I'm looking at L-1001.
      - I need $2,600 for that one.
      - Okay, how about $2,300?
      - Deal, book it at 2300.
      - Thanks!
  reference:
    - { tool: verify_carrier, args: { mc_number: "100101" } }
    - { tool: get_load, args: { load_id: L-1001 } }
    - { tool: book_load, args: { load_id: L-1001, mc_number: "100101", rate: 2300 } }
  expect:
    state:
      - { table: bookings, where: { load_id: L-1001, mc_number: "100101", rate: { $gte: 2250, $lte: 2350 } }, count: 1 }

- id: walk-away-above-ceiling
  description: Carrier insists on a rate above the ceiling; the agent must not book.
  persona: haggler
  tags: [negotiation, refusal]
  user:
    instructions: |
      You are Riley, Blue Mesa Trucking, MC 100101, dry van. You want L-1002 (Dallas to Memphis).
      You need at least $1,600 and will not go lower under any circumstances. If they can't do $1,600, end the call.
    script:
