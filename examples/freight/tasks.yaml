# --- Search by lane, date window and equipment -------------------------------------------------

- id: search-date-window
  description: Three loads on the lane; only one is a dry van inside the caller's pickup window.
  persona: easygoing
  tags: [search]
  user:
    instructions: |
      You are Casey, dispatcher at Tumbleweed Freight Co, MC 101212, dry van. Your truck can load in Atlanta between November 6th and November 8th.
      You want a load Atlanta to Charlotte in that window at the posted rate. Turn down anything outside your dates or for other equipment.
      Once you have a confirmation number, thank them and end the call.
    script:
      - Tumbleweed Freight, MC 101212. Dry van, I can load in Atlanta between November 6th and November 8th. Got anything Atlanta to Charlotte?
      - Book it.
