      If they have nothing, you want your truck logged so they can call you when something comes up: accept if they offer, or ask for it.
      End the call once they confirm your truck is logged.
    script:
      - Old Mill Carriers, MC 101111. Dry van, I'll be empty in Denver on November 9th. Anything Denver to Dallas?
      - Yes, log it.
      - Thanks, bye.
  reference:
    - { tool: verify_carrier, args: { mc_number: "101111" } }
