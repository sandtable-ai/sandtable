[project]
name = "sandtable-example-livekit-agents"
version = "0.0.0"
description = "Rehearse a LiveKit Agents voice agent's LLM and tools with sandtable, as text, over the HTTP step protocol."
requires-python = ">=3.10,<3.15"
dependencies = ["livekit-agents>=1.8.8,<2", "livekit-plugins-anthropic>=1.8.8,<2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
