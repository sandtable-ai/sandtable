# Monthly dependency updates, grouped so minor and patch bumps arrive as one pull request per ecosystem.
# Titles follow the Conventional Commit check in .github/workflows/pr.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Major versions are upgraded deliberately, not monthly: commander 15, for one, needs Node 22.12,
    # and the published CLI supports Node 22.0 and later (#101, #350).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
