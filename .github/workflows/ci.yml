name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The same gate AGENTS.md asks for before a push: typecheck, tests, build, version and
      # changelog checks, then offline smoke runs where the careful scripted agents pass every task.
      - run: npm run check

  python-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build python --out-dir python/dist
      - run: uv run --isolated --with python/dist/*.whl python -c "import sandtable_ai.cli"
      # `uvx sandtable-ai` needs an executable named after the package, next to `sandtable`.
      - run: unzip -p python/dist/*.whl "*.dist-info/entry_points.txt" | grep -q "^sandtable-ai = sandtable_ai.cli:main"
