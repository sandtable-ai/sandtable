name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js lint examples/freight
      - run: node dist/cli.js lint examples/clinic
      - run: node scripts/sync-version.mjs --check
      # Offline smoke tests: the careful scripted agents must pass every task.
      - run: node dist/cli.js run examples/freight --agent scripted:careful --user scripted --fail-under 100 --no-html
      - run: node dist/cli.js run examples/clinic --agent scripted:clinic-careful --user scripted --fail-under 100 --no-html

  python-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build python --out-dir python/dist
      - run: uv run --isolated --with python/dist/*.whl python -c "import sandtable_ai.cli"
