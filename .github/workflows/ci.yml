name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels the run it replaces; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The same gate AGENTS.md asks for before a push: typecheck, build, tests, version and
      # changelog checks, then offline smoke runs where the careful scripted agents pass every task.
      - run: npm run check

  # Mintlify checks the docs' links only on pull requests into its deploy branch, docs-live (see
  # CONTRIBUTING.md), so pull requests into main check them here.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: docs
        run: npx --yes mint@4.2.981 broken-links

  python-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build python --out-dir python/dist
      - run: uv run --isolated --with python/dist/*.whl python -c "import sandtable_ai.cli"
      - run: uv run --isolated --with pytest --with python/dist/*.whl pytest -q python/tests
      # `uvx sandtable-ai` needs an executable named after the package, next to `sandtable`.
      - run: unzip -p python/dist/*.whl "*.dist-info/entry_points.txt" | grep -q "^sandtable-ai = sandtable_ai.cli:main"

  # Worked examples in examples/frameworks/: each has its own dependencies and an offline check
  # (scripted or mock models, no API keys). Node examples import sandtable-ai from the built root.
  frameworks:
    name: frameworks (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: vercel-ai-sdk, runtime: node }
          - { example: openai-agents, runtime: node }
          - { example: claude-agent-sdk, runtime: node }
          - { example: pipecat, runtime: python }
          - { example: livekit-agents, runtime: python }
          - { example: http-service, runtime: python }
    steps:
      - uses: actions/checkout@v7
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/frameworks/${{ matrix.example }}/package-lock.json
      - if: matrix.runtime == 'node'
        run: npm ci && npm run build
      - if: matrix.runtime == 'node'
        working-directory: examples/frameworks/${{ matrix.example }}
        run: npm ci && npm run check
      - if: matrix.runtime == 'python'
        uses: astral-sh/setup-uv@v7
      - if: matrix.runtime == 'python'
        run: uv run --directory examples/frameworks/${{ matrix.example }} python -m pytest -q
